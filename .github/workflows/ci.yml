# PR과 dev·main 푸시에서 저장소 검사를 실행한다. 브랜치 보호가 이 작업들의 통과를 병합 조건으로 건다.
# 액션은 태그 대신 커밋 SHA로 고정한다(헌법 P-14). 주석의 버전은 SHA가 가리키는 태그다.
name: CI

on:
  pull_request:
    # edited: PR의 병합 대상을 바꾸면 release-source를 새 대상 기준으로 다시 실행한다.
    types: [opened, synchronize, reopened, edited]
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # 브랜치 보호의 필수 검사 이름으로 쓰므로 바꾸면 보호 규칙도 함께 고친다.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 버전을 적지 않으면 루트 package.json의 packageManager(pnpm@12.21.0)를 쓴다.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 테스트
        run: pnpm test

      - name: 문서 구조 검사
        run: node scripts/check-docs.mjs

  release-source:
    # ADR-0013: main에는 dev에서 온 릴리스 PR만 병합한다.
    name: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 병합 대상과 출발 브랜치 확인
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "main" ] && { [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; }; then
            echo "::error::main으로 가는 PR은 이 저장소의 dev에서만 열 수 있다. 작업 PR은 dev로 보낸다 (ADR-0013). 현재 출발: $HEAD_REPO:$HEAD_REF"
            exit 1
          fi
          echo "병합 대상: ${BASE_REF:-없음(push)}, 출발: ${HEAD_REPO:-없음(push)}:${HEAD_REF:-없음(push)}"
