name: Task
description: PR 하나로 끝나는 작업 이슈를 만든다.
title: "[NNN] "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Task 이슈 하나는 PR 하나로 끝낸다. PR의 변경 줄 수는 약 200줄을 기준으로 삼는다.
        SDD 대상 작업은 `/sdd-tasks`가 이 양식과 같은 절로 이슈를 만들고, `/sdd-implement`는 이 절 이름으로 본문을 읽는다.
        이 양식으로 직접 만들 때도 절을 빼지 않고, 상위 Feature와 같은 마일스톤을 지정한다. 이슈를 만든 뒤에는 `gh issue edit <이 이슈 번호> --parent <Feature 번호>`로 하위 이슈로 연결한다.
        제목은 `[001] 요구사항 검토와 확인 질문 해결`처럼 쓴다. 인프라 작업은 `[R0] pnpm 모노레포 뼈대 구성`처럼 릴리스 코드로 시작한다.
  - type: input
    id: parent
    attributes:
      label: 상위 Feature
      description: 상위 Feature 이슈 번호를 적는다.
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 관련 문서
      description: 이 작업의 근거가 되는 요구사항과 설계 문서 경로를 적는다. 스펙 폴더가 없는 인프라 작업은 근거가 되는 ADR 경로를 적는다.
      placeholder: |
        - 요구사항: docs/specs/003-row-counter/requirements.md
        - 설계: docs/specs/003-row-counter/design/erd.md
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 다루는 수용 기준
      description: 이 작업이 구현하는 AC를 기능 번호와 함께 한 줄에 하나씩 적는다. 설정이나 기반 작업처럼 다루는 AC가 없으면 "없음"과 그 이유를 적는다.
      placeholder: |
        - 003/AC-04: 리셋하기 전에 확인을 받는다
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 바꿀 파일이나 영역과 할 일을 적는다. 설계 문서에 없는 결정은 여기서 새로 정하지 않고 설계 문서부터 고친다.
      placeholder: |
        -
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 밖
      description: 이 작업에서 하지 않는 일을 적는다. 없으면 "없음"이라고 적는다.
      placeholder: |
        -
    validations:
      required: true
  - type: input
    id: blocked-by
    attributes:
      label: 선행 Task
      description: 이 작업보다 먼저 끝나야 하는 Task 이슈 번호를 적는다. 둘 이상이면 쉼표로 구분하고, 없으면 "없음"이라고 적는다.
      placeholder: "#15 또는 없음"
    validations:
      required: true
  - type: checkboxes
    id: done
    attributes:
      label: 완료 조건
      description: PR을 병합하기 전에 모두 확인한다.
      options:
        - label: 다루는 수용 기준에 적은 AC를 모두 구현했다
        - label: AC를 확인하는 테스트 이름에 기능 번호와 AC ID를 넣었다(예 003/AC-04)
        - label: typecheck가 통과한다
        - label: lint가 통과한다
        - label: test가 통과한다
        - label: 설계와 다르게 구현해야 했다면 설계 문서를 먼저 고쳤다
