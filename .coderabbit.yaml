# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR review settings. Reference: https://docs.coderabbit.ai/reference/configuration
# AGENTS.md and CLAUDE.md are read automatically as code guidelines (knowledge_base.code_guidelines).
# Public repositories with fewer than 10 stars are not reviewed automatically: comment `@coderabbitai review` on the PR.

language: ko-KR
tone_instructions: "합쇼체로 간결하게 쓴다. 지적마다 근거가 되는 AGENTS.md 규칙, 헌법 원칙(P-xx), ADR 번호를 밝힌다. 취향 차이는 지적하지 않는다."

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/*.tsbuildinfo"
    - "!**/next-env.d.ts"
  path_instructions:
    - path: "apps/**"
      instructions: |
        - `@supabase/supabase-js`나 `@supabase/ssr`을 import하면 지적한다. 앱은 `@hamtteukka/shared` 함수로만 데이터에 접근한다 (ADR-0003).
        - Server Action은 shared 함수를 호출하고 결과를 전달하는 얇은 래퍼여야 한다. 비즈니스 규칙이 들어 있으면 지적한다.
        - `NEXT_PUBLIC_` 환경 변수에 service-role 키나 비밀 값이 들어가면 지적한다 (헌법 P-10).
        - 화면은 모바일 우선 반응형 레이아웃과 다크 모드를 지원해야 한다 (헌법 P-12).
    - path: "packages/shared/**"
      instructions: |
        - 공개 함수는 zod로 정의한 자체 DTO와 자체 오류 타입을 반환해야 한다. Supabase가 생성한 타입이나 `PostgrestError`가 밖으로 드러나면 지적한다 (ADR-0003).
        - `next/headers` 같은 Next.js API에 직접 의존하면 지적한다. 쿠키 접근 방법은 앱이 넘겨준다.
        - 다른 패키지가 쓰는 이름은 `src/index.ts`에서 내보내야 한다.
    - path: "supabase/migrations/**"
      instructions: |
        - 브라우저나 앱이 접근하는 테이블에 RLS가 켜져 있고, 허용하는 작업마다 정책이 있는지 확인한다 (ADR-0004).
        - 정책이 해당 기능의 `docs/specs/NNN-*/design/erd.md` 정책 표와 같은지 확인한다. 정책을 바꾸면서 정책 표를 고치지 않았으면 지적한다.
        - 이메일을 회원 식별 키(UNIQUE 키, 조인 키)로 쓰면 지적한다 (ADR-0005).
        - `commerce` 스키마를 만들거나 바꾸면 지적한다. 이 스키마는 R4에서 Spring의 Flyway가 소유한다 (ADR-0006).
        - 잔액, 충전, 지갑을 뜻하는 테이블이나 열을 만들면 지적한다 (ADR-0009).
        - 도안 가격 열은 R4 전까지 CHECK 제약으로 0만 허용해야 한다 (ADR-0007).
    - path: "**/*.test.{ts,tsx}"
      instructions: |
        - 수용 기준을 확인하는 테스트는 이름이 `NNN/AC-xx`로 시작해야 한다. 예: `003/AC-04 리셋하기 전에 확인을 받는다`
        - 권한을 다루는 테스트는 허용되는 경우와 거부되는 경우를 모두 확인해야 한다.
        - 테스트를 건너뛰게 바꾸거나 실패하는 테스트를 지운 변경은 지적한다.
    - path: "**/package.json"
      instructions: |
        - 의존성 버전에 `^`, `~` 같은 범위 지정자가 있으면 지적한다 (헌법 P-14).
        - 의존성 버전 올리기가 기능 변경과 같은 PR에 섞여 있으면 지적한다 (헌법 P-14).
    - path: "docs/**/*.md"
      instructions: |
        - 한국어 평서체(`-다`)로 쓰고 한 문서 안에서 어체를 섞지 않았는지 확인한다.
        - frontmatter(`doc_type`, `status`, `updated`)와 두 문장 이상의 리드가 있어야 한다.
        - Mermaid 다이어그램은 flowchart, sequenceDiagram, classDiagram, erDiagram, stateDiagram-v2, timeline, gantt만 쓰고, 한글 라벨은 큰따옴표로 감싸야 한다.
        - ADR 번호, 출시 단계, 기능 ID가 다른 문서와 어긋나면 지적한다.
    - path: "docs/research/**"
      instructions: |
        - 조사 기록은 조사 시점의 기록이다. 기존 파일의 내용이 바뀌었으면 지적하고, 새 조사 문서로 남기라고 안내한다.
  pre_merge_checks:
    custom_checks:
      - name: "PR 템플릿"
        mode: warning
        instructions: |
          PR 본문에 다음 8개 절 제목이 모두 있으면 통과다: "해결하려는 문제가 무엇인가요?", "왜 해야 하나요?", "어떻게 해결했나요?", "이 PR의 한계 & 트레이드오프", "기존 기능에 미치는 영향", "Edge Case & 실패 시나리오", "검토한 대안과 선택 이유", "리뷰 포인트". 하나라도 없으면 실패다. 이슈 없는 PR도 허용하므로 `Closes #<번호>`가 없어도 실패로 보지 않는다. 다만 본문에 `Closes #<번호>`가 있으면 "해결하려는 문제가 무엇인가요?" 절의 첫 줄에 있어야 한다 (ADR-0012).
      - name: "검증 출력 첨부"
        mode: warning
        instructions: |
          `apps/`, `packages/`, `supabase/` 아래 파일을 바꾸지 않은 PR이면 통과다. 바꾼 PR이면, 본문에 typecheck, lint, test 실행 출력과 종료 코드를 담은 `<details>` 블록이 있어야 통과다.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "docs/constitution.md"
        applyTo: "**"
